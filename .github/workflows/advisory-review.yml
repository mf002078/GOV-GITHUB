name: Advisory review contract (offline)
on:
  pull_request:
permissions:
  contents: read
jobs:
  advisory-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check advisory review contract tests
        run: python -m unittest discover -s tests -v
      - name: Boundary
        run: echo "No model API key; no privileged reviewer; no approval or Gate A asserted."
